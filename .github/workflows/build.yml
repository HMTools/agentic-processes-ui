name: Build & Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.0.0)
  workflow_dispatch:  # Allow manual trigger for testing

permissions:
  contents: write  # Required for creating GitHub Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Windows needs MSVC for compiling native modules (node-pty) via @electron/rebuild
      - name: Setup MSVC
        if: matrix.platform == 'win'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Linux needs additional packages for electron-builder
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Build channel-server
        run: node scripts/build-channel-server.js

      - name: Build Vite app
        run: npx vite build

      - name: Build Electron app (${{ matrix.platform }})
        run: npx electron-builder --config electron-builder.yml --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GYP_MSVS_VERSION: '2022'
          # Windows code signing via SignPath (optional)
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          retention-days: 30
