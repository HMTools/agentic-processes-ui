appId: com.agentic-processes.ui
productName: Agentic Processes UI
copyright: Copyright (c) 2024-2026 Matan Hager

# Directories
directories:
  output: release

# Files to include in the asar archive
files:
  - dist/**/*
  - dist-electron/**/*

# Publish to GitHub Releases
publish:
  provider: github
  owner: HMTools
  repo: agentic-processes-ui
  releaseType: release

# ---- Platform-specific targets ----

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: images/icon.png
  # SignPath signs after build via CI integration (see .github/workflows/build.yml)
  # Set CSC_LINK and CSC_KEY_PASSWORD in CI env to enable signing

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: images/icon.png
  identity: null  # Skip code signing (not notarized, documented Gatekeeper workaround)

dmg:
  writeUpdateInfo: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: images/icon.png
  category: Development
